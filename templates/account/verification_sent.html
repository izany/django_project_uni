{% extends 'base.html' %}
{% load i18n %}
{% block content %}

    <!-- LOGIN AREA START (Email Verification Sent) -->
    <div class="ltn__login-area pb-85">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <div class="section-title-area text-center">
                        <h1>Verify <br>Your Email</h1>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-6 offset-lg-3">
                    <div class="account-login-inner text-center">
                        <p>We've sent you an email to verify your address.</p>
                        <p>Follow the link inside to complete your registration.</p>

                        <div class="btn-wrapper mt-30">
                            <a href="{% url 'account_login' %}" class="theme-btn-1 btn">
                                BACK TO SIGN IN
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- LOGIN AREA END -->

{% endblock %}
