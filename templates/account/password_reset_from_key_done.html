{% extends 'base.html' %}
{% load i18n %}
{% block content %}

    <!-- LOGIN AREA START (Password Reset From Key Done) -->
    <div class="ltn__login-area pb-85">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <div class="section-title-area text-center">
                        <h1>Password Changed</h1>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-6 offset-lg-3">
                    <div class="account-login-inner text-center">
                        <p style="color: #4CAF50; font-size: 18px;">
                            Your password has been changed successfully.
                        </p>
                        <p>You can now sign in with your new password.</p>

                        <div class="btn-wrapper mt-30">
                            <a href="{% url 'account_login' %}" class="theme-btn-1 btn">
                                SIGN IN
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- LOGIN AREA END -->

{% endblock %}
