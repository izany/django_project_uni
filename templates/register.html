{% extends 'base.html' %}
{% block content %}

    <!-- LOGIN AREA START (Register) -->
    <div class="ltn__login-area pb-90">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <div class="section-title-area text-center">
                        <h1>Register <br>Your Account</h1>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-6 offset-lg-3">
                    <div class="account-login-inner">
                        <form action="#" method="post" class="ltn__form-box contact-form-box">
                            {% csrf_token %}
                            <div style="color: #E55472">
                                {{ error_form }}
                            </div>
                            {{ form }}
                            <label class="checkbox-inline" name="consent">
                                <input type="checkbox" value="" required="required">
                                I consent to the privacy policy
                            </label>
                            <div class="btn-wrapper">
                                <button class="theme-btn-1 btn reverse-color btn-block" type="submit">CREATE ACCOUNT</button>
                            </div>
                        </form>
                        <div class="by-agree text-center">
                            <br/>
                            <p>:By creating an account, you agree to our</p>
                            <p>
                                <a href="{% url 'terms_of_service' %}">TERMS AND CONDITIONS</a>
                            </p>
                            <div class="go-to-btn mt-50">
                                <a href="/login">? ALREADY HAVE AN ACCOUNT</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- LOGIN AREA END -->

{% endblock %}
